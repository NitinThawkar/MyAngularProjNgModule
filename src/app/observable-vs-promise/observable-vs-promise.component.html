<h3>observable-vs-promise</h3>
<span>
    Click on Create button to create Observable and Promise
    <br>
    Click on Execute button to execute Observable and Promise
    <br>
    Click on Cancel button to cancel Observable subscription
<br>see result in console
</span>
<br>
<div class="container">
  <div class="btn-container">
    <button class="btn btn-info" (click)="create()">Create</button>
  </div>
  <div class="btn-container">
    <button class="btn btn-success" (click)="execute()">Execute</button>
  </div>
  <div class="btn-container">
    <button class="btn btn-danger" (click)="cancel()">Cancel</button>
  </div>
</div>
